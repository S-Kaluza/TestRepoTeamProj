<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Film</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Wspólne style dla nakładek (Glassmorphism) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.5s ease-in-out;
            z-index: 10;
        }

        #choices-overlay {
            opacity: 0;
            pointer-events: none;
        }

        #choices-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #start-overlay {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 60%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .choice-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="player" playsinline></video>
        
        <!-- Nakładka startowa -->
        <div id="start-overlay" class="overlay">
            <button id="start-btn" class="choice-btn" disabled>Ładowanie konfiguracji...</button>
        </div>

        <div id="choices-overlay" class="overlay">
            <!-- Przyciski decyzyjne -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const player = document.getElementById("player");
            const choicesOverlay = document.getElementById("choices-overlay");
            const startOverlay = document.getElementById("start-overlay");
            const startBtn = document.getElementById("start-btn");
            let storyGraph = {};

            // ŚCIEŻKA ZAKTUALIZOWANA: Dopasowana do Twojego adresu aplikacji (/hello/api/story/)
            fetch("/hello/api/story/")
                .then(response => {
                    if (!response.ok) throw new Error("Błąd sieci podczas pobierania konfiguracji.");
                    return response.json();
                })
                .then(data => {
                    storyGraph = data;
                    startBtn.innerText = "Rozpocznij projekcję";
                    startBtn.disabled = false;
                })
                .catch(error => {
                    console.error("Wystąpił błąd:", error);
                    startBtn.innerText = "Błąd wczytywania danych";
                });

            startBtn.addEventListener("click", () => {
                startOverlay.classList.add("hidden");
                loadNode("start");
            });

            player.addEventListener("ended", () => {
                choicesOverlay.classList.add("active");
            });

            function loadNode(nodeId) {
                const nodeData = storyGraph[nodeId];
                if (!nodeData) {
                    console.error("Brak definicji dla węzła:", nodeId);
                    return;
                }

                choicesOverlay.classList.remove("active");
                player.src = nodeData.video_url;
                player.play().catch(e => console.error("Błąd odtwarzania:", e));

                choicesOverlay.innerHTML = ""; 
                
                if (nodeData.choices && nodeData.choices.length > 0) {
                    nodeData.choices.forEach(choice => {
                        const btn = document.createElement("button");
                        btn.className = "choice-btn";
                        btn.innerText = choice.text;
                        btn.onclick = () => loadNode(choice.next);
                        choicesOverlay.appendChild(btn);
                    });
                } else {
                    const restartBtn = document.createElement("button");
                    restartBtn.className = "choice-btn";
                    restartBtn.innerText = "Zacznij od nowa";
                    restartBtn.onclick = () => {
                        choicesOverlay.classList.remove("active");
                        startOverlay.classList.remove("hidden");
                    };
                    choicesOverlay.appendChild(restartBtn);
                }
            }
        });
    </script>
</body>
</html>
